{% extends "base.html" %}
{% block content %}
<div class="card">
    <h1>Prihlásenie</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
        <label>Používateľské meno<input type="text" name="username"></label>
        <label>Heslo<input type="password" name="password"></label>
        <button type="submit">Prihlásiť</button>
    </form>
</div>
{% endblock %}
