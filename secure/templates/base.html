<!doctype html>
<html lang="sk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Správca produktov (BEZPEČNÁ){% endblock %}</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
        header { background: #0b6e3b; color: #fff; padding: .75rem 1rem; border-radius: 8px; }
        header a { color: #fff; margin-right: 1rem; }
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
        .error { color: #b00020; font-weight: bold; }
        input { padding: .4rem; margin: .2rem 0; width: 100%; box-sizing: border-box; }
        button { padding: .5rem 1rem; cursor: pointer; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: .4rem .6rem; text-align: left; }
    </style>
</head>
<body>
    <header>
        <strong>✅ BEZPEČNÁ verzia</strong> &nbsp;|&nbsp;
        <a href="{{ url_for('index') }}">Domov</a>
        <a href="{{ url_for('products') }}">Produkty</a>
        {% if user %}
            <a href="{{ url_for('logout') }}">Odhlásiť ({{ user }})</a>
        {% else %}
            <a href="{{ url_for('login') }}">Login</a>
        {% endif %}
    </header>
    {% block content %}{% endblock %}
</body>
</html>
